name: CI
# Pull requests only, and deliberately. GitHub builds a pull request's checks
# against the head merged into `main`, so what these jobs run on is already the
# merge result rather than the branch in isolation - running them again after the
# merge tests a tree that passed a minute earlier.
#
# It also ends a confusion the release job introduced: that job pushes a version
# commit seconds behind every merge, which landed in the same concurrency group
# as the merge itself and cancelled its checks, leaving every merge commit
# showing a cancelled run forever.
#
# What this gives up is the case where two pull requests pass separately and
# conflict in meaning once both are in. Closing that needs the branch to be up to
# date before merging, which is a repository setting rather than anything here,
# and `workflow_dispatch` remains for asking `main` the question by hand.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The hook downloads a browser on first use, and a runner with no cache pays
      # that on every job. Caching it by the pinned puppeteer version means a bump
      # misses deliberately rather than restoring a browser the pin no longer names.
      - name: Cache the pinned browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer|${{ matrix.os }}|${{ hashFiles('package-lock.json') }}
      - name: Check the pins agree
        run: npm run check-pins
      - name: Test
        run: npm test
  # The release writes the version into two files and cuts a tag from it, and it
  # is exercised exactly once per release - on main, where a mistake is already
  # pushed. Its arithmetic and its two rewrites are therefore tested here, where
  # they are free.
  release_scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          cache-dependency-glob: |
            scripts/*.py
            test/*.py
      - name: Test
        run: ./test/test_version.py
  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The repository checks its own links with the entry point it ships, as a
      # `language: system` hook against this tree rather than against a published
      # rev, so the dependencies have to be present before the hooks run.
      - name: Install
        run: npm ci
      - name: Run the hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
