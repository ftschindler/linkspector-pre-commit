name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci_${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The hook downloads a browser on first use, and a runner with no cache pays
      # that on every job. Caching it by the pinned puppeteer version means a bump
      # misses deliberately rather than restoring a browser the pin no longer names.
      - name: Cache the pinned browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer|${{ matrix.os }}|${{ hashFiles('package-lock.json') }}
      - name: Check the pins agree
        run: npm run check-pins
      - name: Test
        run: npm test
  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run the hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
